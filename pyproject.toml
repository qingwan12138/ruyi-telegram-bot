[project]
name = "ruyi-telegram-bot"
version = "0.1.0"
description = "Independent Telegram notification and human-interaction service for RuyiSDK automation."
authors = [{ name = "RuyiSDK Contributors" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dynamic = ["dependencies"]

[project.scripts]
ruyi-telegram-bot = "telegram_bot.__main__:main"

[tool.poetry]
packages = [{ include = "telegram_bot" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = ">=0.115,<1.0"
uvicorn = ">=0.30,<1.0"
python-telegram-bot = ">=22.6,<23.0"
python-dotenv = ">=1.0,<2.0"
httpx = ">=0.27,<0.29"
pydantic = ">=2.7,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-asyncio = ">=0.24,<2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
